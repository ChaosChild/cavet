# cavet CLI release config (implementation-plan Task 23). goreleaser v2 schema.
# Six targets. Prebuilt binaries are Homebrew casks (`brews:` is deprecated in
# v2) and a Scoop manifest committed to the bucket root (no directory:).
version: 2

project_name: cavet

builds:
  - id: cavet
    main: ./cmd/cavet
    binary: cavet
    env: [CGO_ENABLED=0]
    targets: [windows_amd64, windows_arm64, linux_amd64, linux_arm64, darwin_amd64, darwin_arm64]
    ldflags:
      - -s -w
      - -X github.com/ChaosChild/cavet/internal/cli.version={{.Version}}

archives:
  - id: cavet
    ids: [cavet]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

# Keyless Sigstore bundles (docs "Sign"): certificate and signature combined
# into one .sigstore.json per artifact. Verify: cosign verify-blob --bundle
# <artifact>.sigstore.json <artifact>.
signs:
  - id: checksum-bundle
    cmd: cosign
    signature: '${artifact}.sigstore.json'
    args: [sign-blob, '--bundle=${signature}', '${artifact}', --yes]
    artifacts: checksum
  - id: sbom-bundle
    cmd: cosign
    signature: '${artifact}.sigstore.json'
    args: [sign-blob, '--bundle=${signature}', '${artifact}', --yes]
    artifacts: sbom

homebrew_casks:
  - repository:
      owner: ChaosChild
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    homepage: https://github.com/ChaosChild/cavet
    description: Advisory security tooling for coding agents
    binaries: [cavet]

scoops:
  - repository:
      owner: ChaosChild
      name: scoop-bucket
      token: '{{ .Env.SCOOP_BUCKET_TOKEN }}'
    homepage: https://github.com/ChaosChild/cavet
    description: Advisory security tooling for coding agents
    license: MIT

release:
  github:
    owner: ChaosChild
    name: cavet
